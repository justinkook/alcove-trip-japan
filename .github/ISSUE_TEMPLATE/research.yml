name: Research
description: Retrieve existing evidence for an open review concern
title: "[research] "
labels: ["research", "proposed"]
body:
  - type: markdown
    attributes:
      value: |
        Evidence Issue for agents and travelers. **Keep the field titles below unchanged** — Alcove assist patches `### Sources to check`, `### Conclusion`, and `### Status` by those headings.
        Filling this Issue does **not** resolve the parent PR review thread; only the Alcove reviewer does after re-evaluation.
  - type: input
    id: parent
    attributes:
      label: Parent PR / review thread
      description: Link to the pull request or unresolved review thread this research answers.
      placeholder: https://github.com/OWNER/REPO/pull/N#discussion_r…
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The assumption or open question to check against existing sources.
      placeholder: What was the August 2026 opening time for Fushimi Inari?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources to check
      description: URLs, docs, or prior Issues to consult. Prefer primary sources. (Alcove-patched section — do not rename.)
      placeholder: |
        - https://…
        - Prior issue #…
    validations:
      required: true
  - type: textarea
    id: conclusion
    attributes:
      label: Conclusion
      description: Fill when done. State what was found, with citations. Leave blank until research finishes. (Alcove-patched section — do not rename.)
      placeholder: Verified / unknown — cite sources.
    validations:
      required: false
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Workflow label should match. Move to `in-progress` / `resolved` as you work. (Alcove-patched section — do not rename.)
      options:
        - proposed
        - in-progress
        - resolved
      default: 0
    validations:
      required: true
