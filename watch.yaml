# Optional hosted-watch / client-scheduled automation configs for THIS trip repo.
# Alcove stores only enablement + cadence; what to check lives here (ADR-0010 / ADR-0013).
#
# schema_version is required when this file exists. Bump only with Alcove + starter together.
#
# Generic kinds the worker understands:
#   weather  — Open-Meteo for `locations` (thresholds optional)
#   infer    — weather + `prompt` → provenance-honest inference
#   research — `prompt` only (no geo fetch)
#
# Delete this file, or leave `checks: []`, until you want something watched.

schema_version: 1
checks:
  - id: fuji-sighting-window
    kind: infer
    prompt: >
      Infer Mt Fuji clear-sighting odds for outdoor Tokyo/Hakone blocks over the next
      3 days from cloud cover. Favorable windows are material; do not claim verified cams.
    timezone: Asia/Tokyo
    cloud_cover_max: 45
    locations:
      - label: Tokyo
        lat: 35.6812
        lon: 139.7671
      - label: Hakone
        lat: 35.2324
        lon: 139.1067

  - id: tokyo-rain-window
    kind: weather
    prompt: Outdoor Tokyo blocks that break on heavy rain
    timezone: Asia/Tokyo
    precip_mm_min: 5
    locations:
      - label: Tokyo
        lat: 35.6812
        lon: 139.7671

  - id: ryokan-cancel-deadline
    kind: research
    prompt: >
      Remind whether the Hakone ryokan free-cancel cutoff is approaching relative to
      trip dates in this repo. Mark material: yes only if a deadline is likely within
      a few days; otherwise material: no. Do not invent booking portal state.
